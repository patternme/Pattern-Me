<style>
  :root {
    --bg: #FFFFFF;
    --fg: #222323;
    --muted: #8A8D93;
    --hair: #C6C8CC;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #000000;
      --fg: #FFFFFF;
      --muted: #8A8D93;
      --hair: #2C2D2E;
    }
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--bg);
  }

  body {
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    color: var(--fg);
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
  }

  /* subtle diagonal pattern nodding to the brand's angled monogram cuts */
  body::before {
    content: "";
    position: absolute;
    inset: 0;
    background-image: repeating-linear-gradient(
      -45deg,
      var(--hair) 0,
      var(--hair) 1px,
      transparent 1px,
      transparent 64px
    );
    opacity: 0.35;
    pointer-events: none;
  }

  .stage {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2.6rem;
    padding: 2rem;
    text-align: center;
  }

  .logo {
    width: min(72vw, 480px);
    height: auto;
    display: block;
  }

  .logo-dark { display: block; }
  .logo-light { display: none; }

  @media (prefers-color-scheme: dark) {
    .logo-dark { display: none; }
    .logo-light { display: block; }
  }

  .rule {
    width: 44px;
    height: 1px;
    background: var(--fg);
    opacity: 0.4;
  }

  .contact-btn {
    display: inline-block;
    font-family: inherit;
    font-size: 0.78rem;
    font-weight: 500;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    text-decoration: none;
    color: var(--fg);
    background: transparent;
    border: 1px solid var(--fg);
    padding: 0.95rem 2.1rem;
    transition: background 0.2s ease, color 0.2s ease;
  }

  .contact-btn:hover,
  .contact-btn:focus-visible {
    background: var(--fg);
    color: var(--bg);
  }

  footer {
    position: absolute;
    bottom: 2rem;
    left: 0;
    right: 0;
    text-align: center;
    font-size: 0.68rem;
    letter-spacing: 0.12em;
    color: var(--muted);
    text-transform: uppercase;
  }
</style>
</head>
